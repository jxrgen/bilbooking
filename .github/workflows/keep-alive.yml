name: Keep Supabase Project Active

on:
  schedule:
    # Run every day at 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to keep project active
        run: |
          curl -X POST \
            'https://fdwiooogkophykysbbrh.supabase.co/rest/v1/rpc/ping_keep_alive' \
            -H 'apikey: sb_publishable_TEUUw-SUTC_XyQ3aNK1VKg_s9A8WAf4' \
            -H 'Content-Type: application/json' \
            -d '{}'
        continue-on-error: true
